name: DupeSpace
options:
  bundleIdPrefix: com.gorkemgur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  DupeCore:
    path: Packages/DupeCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  DupeSpace:
    type: application
    platform: iOS
    sources:
      - path: DupeSpace/Sources
      - path: Shared
      - path: DupeSpace/Assets.xcassets
      - path: DupeSpace/PrivacyInfo.xcprivacy
    dependencies:
      - package: DupeCore
        product: DupeCore
      - target: DupeSpaceWidgets
    entitlements:
      path: DupeSpace/DupeSpace.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gorkemgur.dupespace
    info:
      path: DupeSpace/Info.plist
      properties:
        CFBundleDisplayName: DupeSpace
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.gorkemgur.dupespace
            CFBundleURLSchemes:
              - dupespace
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: >-
          DupeSpace reads your photo library on this device to find duplicate photos and
          videos and to show what they cost you in storage. Nothing is uploaded anywhere.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gorkemgur.dupespace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # Both configurations. It was Debug-only-off and Release-on, which made the project
        # unable to do the one thing it is now for: pressing Run with a phone plugged in uses
        # *Debug*, and a Debug build that may not be signed cannot be installed on a device.
        # Every CI invocation already passes CODE_SIGNING_ALLOWED=NO on its own command line,
        # so nothing in this file needs to say it.
        CODE_SIGN_STYLE: Automatic

  DupeSpaceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DupeSpaceWidgets
      - path: Shared
    dependencies:
      - package: DupeCore
        product: DupeCore
    info:
      path: DupeSpaceWidgets/Info.plist
      properties:
        CFBundleDisplayName: DupeSpace
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DupeSpaceWidgets/DupeSpaceWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gorkemgur.dupespace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gorkemgur.dupespace.widgets
        SKIP_INSTALL: YES
        # Same as the app: the extension has to be signable in both configurations, or the app
        # can be neither run on a device nor archived with it inside.
        CODE_SIGN_STYLE: Automatic

  DupeSpaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DupeSpaceTests
    dependencies:
      - target: DupeSpace
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  DupeSpaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DupeSpaceUITests
    dependencies:
      - target: DupeSpace
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

schemes:
  DupeSpace:
    build:
      targets:
        DupeSpace: all
        DupeSpaceWidgets: all
        DupeSpaceTests: [test]
        DupeSpaceUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DupeSpaceTests
        - DupeSpaceUITests
