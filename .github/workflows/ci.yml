name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Homebrew re-indexes the world before every `install` otherwise: 20-40 seconds per job,
  # three jobs, for formulae whose version this project does not care about.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:

  # Exists for one reason: a verdict in about a minute.
  #
  # Everything else in this file takes between seven and twelve, and for the last several
  # rounds the thing that actually held us up was waiting on all of it to find out about a
  # one-line type error. This job compiles and stops. Red here means do not bother reading
  # the rest.
  compile:
    name: Does it compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          python3 Scripts/check-signing.py

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .derived-compile
          key: compile-${{ runner.os }}-${{ hashFiles('DupeSpace/Sources/**/*.swift', 'Shared/**/*.swift', 'DupeSpaceWidgets/**/*.swift', 'Packages/DupeCore/Sources/**/*.swift', 'project.yml') }}
          restore-keys: |
            compile-${{ runner.os }}-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .derived-compile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee compile.log

      # Release as well as Debug, because Release is the configuration that ships and until
      # now nothing in this pipeline ever built it. Whole-module optimisation and a different
      # set of build settings can fail where Debug does not, and the first time anyone would
      # have found that out is the first time they tried to archive.
      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .derived-release \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee -a compile.log

      - name: What did not compile
        if: failure()
        run: |
          # Both, deliberately. A grep for `error:` alone printed nothing the first time this
          # job ran red, because the failure was xcodebuild refusing a flag rather than the
          # compiler refusing a line — and a job that fails while reporting "none" is worse
          # than no job.
          echo "::group::Compile errors"
          grep -nE "error:" compile.log | sort -u | head -40 || echo "none"
          echo "::endgroup::"
          echo "::group::Last lines"
          tail -20 compile.log
          echo "::endgroup::"

  core:
    name: DupeCore unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

          # No iOS 26-only API is called any more — the one that was, `glassEffect`, made the
          # reading on the dock illegible and was removed — so there is nothing to assert
          # here beyond what the build itself will say.

      # The rule the whole layering rests on, enforced by the build rather than by
      # discipline. DupeCore holds the reasoning that decides what gets deleted, and it is
      # testable on a Linux box precisely because none of it can reach a platform framework.
      # Nothing checked that until it was a grep.
      - name: DupeCore must stay platform-free
        run: |
          set -euo pipefail
          if grep -rnE '^import (SwiftUI|UIKit|Photos|PhotosUI|Vision|AVFoundation|ActivityKit|WidgetKit|CoreGraphics|ImageIO)$'               Packages/DupeCore/Sources; then
            echo "::error::DupeCore imported a platform framework. The engine has to stay testable without a simulator."
            exit 1
          fi
          echo "clean"

      - name: Cache the package build
        uses: actions/cache@v4
        with:
          path: Packages/DupeCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/DupeCore/Sources/**/*.swift', 'Packages/DupeCore/Tests/**/*.swift', 'Packages/DupeCore/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run tests
        run: swift test --package-path Packages/DupeCore

  app:
    name: Unit tests on a simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: simulator
        run: echo "udid=$(python3 Scripts/pick-simulator.py)" >> "$GITHUB_OUTPUT"

      # A cold build is two and a half minutes of the six this job takes, every single push,
      # to recompile files that did not change. The key moves with the sources so a hit is
      # exact; `restore-keys` falls back to the most recent build of this branch, which is
      # what makes the *incremental* case work — the common one, where two files changed.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .derived
          key: derived-${{ runner.os }}-${{ hashFiles('DupeSpace/Sources/**/*.swift', 'Shared/**/*.swift', 'DupeSpaceWidgets/**/*.swift', 'Packages/DupeCore/Sources/**/*.swift', 'project.yml') }}
          restore-keys: |
            derived-${{ runner.os }}-

      # Built once, then run twice. `build-for-testing` is most of the cost of this job, and
      # running it separately means the unit verdict and the UI verdict do not queue behind
      # each other's compile.
      - name: Build for testing
        run: |
          set -o pipefail
          # -enableCodeCoverage NO: instrumenting every file costs about a minute and nothing
          # in this pipeline reads the coverage. -derivedDataPath: so the cache above has
          # something to hold on to.
          xcodebuild build-for-testing \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath .derived \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log

      # The fast half, and the one that catches most of what goes wrong: no app launches, no
      # scans, no waiting on an accessibility tree. Four minutes against the UI half's twenty.
      #
      # IT USED TO SHARE A JOB WITH THE SLOW HALF, and that was costing whole mornings. GitHub
      # serves a job's log only once the job has *finished*, so a unit verdict that was known
      # at minute six could not be read until minute twenty-six — and every one of those waits
      # ended with a push that cancelled the run that was about to answer the next question.
      # Its own job, its own runner, its own simulator. The build is paid twice and it is
      # cached; the wait was paid every time.
      #
      # It also deletes a step. The two runs used to need the device shut down and rebooted
      # between them, because the UI half clones the simulator and a clone taken from a live
      # SpringBoard is denied by `SBMainWorkspace`. Separate jobs never share a device.
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath .derived \
            -resultBundlePath TestResults.xcresult \
            -only-testing:DupeSpaceTests \
            -enableCodeCoverage NO \
            2>&1 | tee -a xcodebuild.log

      # Only when something went wrong. It came back at 203 MB on a green run — a fifth of a
      # gigabyte of coverage and attachment data uploaded so that nobody opens it.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-unit
          path: TestResults.xcresult
          retention-days: 7

      # Last, deliberately.
      #
      # This used to run inside the test step, which put it *above* the artifact upload and a
      # hundred lines of Node deprecation notices — so the tail of the log, which is the only
      # part anyone reads first, never contained the failure. The whole log is three thousand
      # lines and the reason is four of them; those four belong at the bottom.
      - name: What actually failed
        if: failure()
        run: |
          echo "::group::Compile errors"
          grep -nE "error:" xcodebuild.log | grep -v "Checking existence" | sort -u | head -40 || echo "none"
          echo "::endgroup::"
          echo "::group::Test failures"
          python3 Scripts/why-tests-failed.py TestResults.xcresult xcodebuild.log
          echo "::endgroup::"
          echo "::group::Verdict"
          grep -nE "\*\* [A-Z ]+ \*\*" xcodebuild.log | tail -5 || true
          echo "::endgroup::"
  ui:
    name: UI tests (${{ matrix.shard.name }})
    runs-on: macos-15
    # TWO RUNNERS, NOT ONE. Twenty-three UI tests took fourteen minutes on a single machine
    # with two parallel workers — the longest thing left in the pipeline.
    # These are separate suites against separate simulators — nothing is shared and nothing is
    # ordered — so the only thing keeping them on one runner was that nobody had split them.
    #
    # Split by measured cost rather than alphabetically: `HistoryUITests` alone is 220 seconds
    # because every one of its tests runs a whole scan first, and pairing it with the other
    # long suite would have left one shard idle while the other ran.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: review and launch
            slug: a
            only: "-only-testing:DupeSpaceUITests/ReviewUITests -only-testing:DupeSpaceUITests/LaunchUITests"
          - name: history, deletion, scan, group
            slug: b
            only: "-only-testing:DupeSpaceUITests/HistoryUITests -only-testing:DupeSpaceUITests/DeletionUITests -only-testing:DupeSpaceUITests/ScanUITests -only-testing:DupeSpaceUITests/GroupUITests"
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: simulator
        run: echo "udid=$(python3 Scripts/pick-simulator.py)" >> "$GITHUB_OUTPUT"

      # A cold build is two and a half minutes of the six this job takes, every single push,
      # to recompile files that did not change. The key moves with the sources so a hit is
      # exact; `restore-keys` falls back to the most recent build of this branch, which is
      # what makes the *incremental* case work — the common one, where two files changed.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .derived
          key: derived-${{ runner.os }}-${{ hashFiles('DupeSpace/Sources/**/*.swift', 'Shared/**/*.swift', 'DupeSpaceWidgets/**/*.swift', 'Packages/DupeCore/Sources/**/*.swift', 'project.yml') }}
          restore-keys: |
            derived-${{ runner.os }}-

      # Built once, then run twice. `build-for-testing` is most of the cost of this job, and
      # running it separately means the unit verdict and the UI verdict do not queue behind
      # each other's compile.
      - name: Build for testing
        run: |
          set -o pipefail
          # -enableCodeCoverage NO: instrumenting every file costs about a minute and nothing
          # in this pipeline reads the coverage. -derivedDataPath: so the cache above has
          # something to hold on to.
          xcodebuild build-for-testing \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath .derived \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log

      # One simulator per shard, and no cloning. The parallelism is the sharding.
      #
      # This ran with two parallel workers until the numbers came in, and two workers means
      # XCTest *clones* the destination twice. Two shards times two clones is four simulators
      # across two runners, and the run that measured it came back with two failures that were
      # not test failures at all:
      #
      #     Failed to launch <XCUIApplicationImpl: … com.gorkemgur.dupespace>
      #     Error getting main window kAXErrorServerNotFound
      #
      # That is a simulator falling over and an accessibility server going away — resource
      # pressure wearing a test failure's clothes, and it cost more than the concurrency
      # bought. Dropping the clones also deletes the whole `SBMainWorkspace`-denies-the-launch
      # family, which comes from cloning a device that is not at rest.
      #
      # A parallel run also prints only `Test case '...' failed on 'Clone 1 of ...'` — the
      # assertion, the file and the line go to the result bundle, which is what
      # `why-tests-failed.py` reads at the bottom of this job. Serial runs say it out loud.
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath .derived \
            -resultBundlePath TestResults.xcresult \
            ${{ matrix.shard.only }} \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            2>&1 | tee -a xcodebuild.log

      # Only when something went wrong. It came back at 203 MB on a green run — a fifth of a
      # gigabyte of coverage and attachment data uploaded so that nobody opens it.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-ui-${{ matrix.shard.slug }}
          path: TestResults.xcresult
          retention-days: 7

      # Last, deliberately.
      #
      # This used to run inside the test step, which put it *above* the artifact upload and a
      # hundred lines of Node deprecation notices — so the tail of the log, which is the only
      # part anyone reads first, never contained the failure. The whole log is three thousand
      # lines and the reason is four of them; those four belong at the bottom.
      - name: What actually failed
        if: failure()
        run: |
          echo "::group::Compile errors"
          grep -nE "error:" xcodebuild.log | grep -v "Checking existence" | sort -u | head -40 || echo "none"
          echo "::endgroup::"
          echo "::group::Test failures"
          python3 Scripts/why-tests-failed.py TestResults.xcresult xcodebuild.log
          echo "::endgroup::"
          echo "::group::Verdict"
          grep -nE "\*\* [A-Z ]+ \*\*" xcodebuild.log | tail -5 || true
          echo "::endgroup::"
  site:
    name: Landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the page
        run: python3 Scripts/check-site.py docs/index.html

  crossing:
    name: A folder and a library, crossed
    runs-on: macos-15
    # The app's one distinctive claim, on its own runner.
    #
    # The same picture in the photo library and in a folder somebody handed over. Apple's
    # Duplicates stops at the library's edge; a file browser cannot see inside it at all. So
    # until this job existed, the only thing in this repository that proved the crossing was a
    # unit test over hand-built fixtures — the matcher's arithmetic, never the two real
    # analyzers reading two real files through two different frameworks.
    #
    # It is not folded into `real` because that job deletes from the library it just built, and
    # a proof that has to run before the deletions is a proof that has to run somewhere else.
    # Nothing here waits on anything: it is ~7 minutes beside a 12-minute critical path.
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: simulator
        run: echo "udid=$(python3 Scripts/pick-simulator.py)" >> "$GITHUB_OUTPUT"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .derived
          key: crossing-derived-${{ runner.os }}-${{ hashFiles('DupeSpace/Sources/**/*.swift', 'Shared/**/*.swift', 'DupeSpaceWidgets/**/*.swift', 'Packages/DupeCore/Sources/**/*.swift', 'project.yml') }}
          restore-keys: |
            crossing-derived-${{ runner.os }}-

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath .derived \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log

      # The same fixture the `real` job uses, and the crossing pair is the point of it:
      # `crossing-21` goes into the photo library, `exported-21` — the same picture, smaller,
      # renamed, redated — into the folder half, and `folder-only-23` into the folder with no
      # partner anywhere, so that a matcher which simply paired things across the line would
      # be caught rather than congratulated.
      - name: Build a library with a crossing pair in it
        run: swift Scripts/make-library.swift artifacts/library

      # `--setup-only`: media into Photos, the permission granted, and the folder half written
      # into the Files app's own container under `File Provider Storage`, which is what "On My
      # iPhone" shows. There is no `simctl addfile`, and the picker can create an empty folder
      # but not fill one — writing into that container from the host is the only way in.
      # No idb here: every one of those is `simctl`, so this job skips the idb-companion bottle
      # and the pipx install entirely.
      - name: Load the device
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
          mkdir -p artifacts/crossing
          # Kept, because the tail is the only part of a log anybody reads first and this step's
          # output is two thousand lines above it. Which provider directory "On My iPhone" is
          # actually served from is the question this job exists to answer, and it was printed
          # somewhere unreachable.
          python3 Scripts/real-library-check.py "${{ steps.simulator.outputs.udid }}" artifacts/library artifacts/crossing --setup-only \
            2>&1 | tee artifacts/crossing/setup.log

      # The part idb cannot do. `UIDocumentPickerViewController` is hosted out of process, so
      # `idb describe-all` sees a one-line tree with only the app in it; XCUITest addresses
      # system UI by bundle identifier and walks the real picker.
      - name: Grant the folder and scan across it
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath .derived \
            -resultBundlePath TestResults.xcresult \
            -only-testing:DupeSpaceUITests/CrossSourceUITests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            2>&1 | tee -a xcodebuild.log

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-crossing
          path: TestResults.xcresult
          retention-days: 7

      - name: What actually failed
        if: failure()
        run: |
          echo "::group::How the device was loaded"
          cat artifacts/crossing/setup.log 2>/dev/null || echo "the setup step left no log"
          echo "::endgroup::"
          echo "::group::Compile errors"
          grep -nE "error:" xcodebuild.log | grep -v "Checking existence" | sort -u | head -40 || echo "none"
          echo "::endgroup::"
          echo "::group::Test failures"
          python3 Scripts/why-tests-failed.py TestResults.xcresult xcodebuild.log
          echo "::endgroup::"
          echo "::group::Verdict"
          grep -nE "\*\* [A-Z ]+ \*\*" xcodebuild.log | tail -5 || true
          echo "::endgroup::"

  real:
    name: A real Photos library
    runs-on: macos-15
    # Its own runner and its own simulator. It installs media into the device's Photos library
    # and then deletes some of it, which is not a state any other job should inherit.
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # Both caches the idb job already has, and this job did not: it was pulling the
      # idb-companion bottle and compiling the app from nothing on every single run.
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-idb-v1

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: real-derived-${{ runner.os }}-${{ hashFiles('DupeSpace/Sources/**/*.swift', 'Shared/**/*.swift', 'DupeSpaceWidgets/**/*.swift', 'Packages/DupeCore/Sources/**/*.swift', 'project.yml') }}
          restore-keys: |
            real-derived-${{ runner.os }}-

      # The recipe the idb job already proved. `brew trust` because Homebrew refuses formulae
      # from third-party taps without it, and pipx because its shims land somewhere the
      # runner's PATH does not look.
      - name: Install XcodeGen and idb
        run: |
          set -euo pipefail
          brew install xcodegen
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pipx install fb-idb
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/idb" --help > /dev/null

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tail -5

      # Sixteen photographs and eight clips, with four of the photographs and three of the
      # clips built as copies of the others. The answer is known before the scan runs.
      - name: Build a library with known duplicates in it
        run: |
          swift Scripts/make-library.swift artifacts/library
          cat artifacts/library/EXPECTED.txt

      - name: Boot the simulator and install
        id: simulator
        run: |
          set -euo pipefail
          UDID=$(python3 Scripts/pick-simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/DupeSpace.app

      # The one job in this workflow where nothing is a stub: the real PhotoKit library, the
      # real analyzer reading real bytes, and the real deleter answering the system's own
      # confirmation. `PhotoKitDeleter` had never been executed before this job existed.
      - name: Scan and delete for real
        run: python3 Scripts/real-library-check.py "${{ steps.simulator.outputs.udid }}" artifacts/library artifacts/real

      - name: Upload what it saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-library
          path: artifacts/real
          retention-days: 7

  idb:
    name: Simulator automation (idb)
    runs-on: macos-15
    # No `needs: app`. It waited for the entire test job — six to ten minutes — and then built
    # the app again from scratch on its own runner, which is seven minutes of wall clock spent
    # waiting for a result it does not consume. They are separate machines; they can run at
    # the same time. The screenshot commit is [skip ci] either way.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      # brew install idb-companion pulls a large bottle and its dependencies on every run.
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-idb-v1

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: idb-derived-${{ runner.os }}-${{ hashFiles('DupeSpace/Sources/**/*.swift', 'Shared/**/*.swift', 'DupeSpaceWidgets/**/*.swift', 'Packages/DupeCore/Sources/**/*.swift', 'project.yml') }}
          restore-keys: |
            idb-derived-${{ runner.os }}-

      - name: Install XcodeGen and idb
        run: |
          set -euo pipefail
          brew install xcodegen
          # Homebrew refuses formulae from third-party taps until the tap is trusted.
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pipx install fb-idb
          # pipx drops shims in ~/.local/bin, which is not on the runner's default PATH.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/idb" --help > /dev/null

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator, install and inspect
        run: |
          set -euo pipefail
          UDID=$(python3 Scripts/pick-simulator.py)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP=build/Build/Products/Debug-iphonesimulator/DupeSpace.app
          test -d "$APP"

          mkdir -p artifacts

          idb install --udid "$UDID" "$APP"
          # simctl, not idb: it reliably forwards launch arguments, and the fixture
          # flag is what puts a library in front of the app on a fresh simulator.
          xcrun simctl launch "$UDID" com.gorkemgur.dupespace -ui-testing || true

          # The accessibility bridge is not ready the instant launch returns, and on a slow
          # runner "not ready" and "the screen is genuinely empty" look identical. Poll until
          # the tree both parses and carries the root screen, rather than sampling once and
          # calling a cold simulator a regression.
          FOUND=0
          for attempt in $(seq 1 20); do
            if idb ui describe-all --udid "$UDID" > artifacts/accessibility-tree.json 2>artifacts/describe-error.txt \
               && grep -q "storage" artifacts/accessibility-tree.json; then
              FOUND=1
              echo "accessibility tree ready after ${attempt} attempt(s)"
              break
            fi
            sleep 5
          done

          # simctl owns the display, so it can snapshot even when the idb bridge cannot.
          xcrun simctl io "$UDID" screenshot artifacts/launch.png || true

          if [ "$FOUND" -ne 1 ]; then
            echo "root screen never exposed its storage elements"
            tail -20 artifacts/describe-error.txt || true
            exit 1
          fi

          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Walk the app and photograph every screen
        id: walk
        # A partial walk is not a failure worth stopping the run over — the screens it did reach
        # are still worth having — but it must not pass silently either, or the page keeps
        # showing whatever era the missing ones were captured in.
        run: |
          set +e
          python3 Scripts/capture-screens.py "$UDID" artifacts/screens
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Measure layout and animation
        run: python3 Scripts/audit-ui.py "$UDID" artifacts/audit

      - name: Commit the screenshots
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          shopt -s nullglob
          shots=(artifacts/screens/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "no screenshots to commit"
            exit 0
          fi

          # Replaced wholesale rather than copied over: a screenshot the walk could not take
          # this time is a screenshot of an app that no longer exists, and leaving it beside
          # eight new ones is how the page came to show two designs at once.
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp "${shots[@]}" docs/screenshots/

          # The audit report travels with the pictures: an artifact nobody downloads is a
          # measurement nobody reads.
          if [ -f artifacts/audit/ui-audit.md ]; then
            cp artifacts/audit/ui-audit.md docs/ui-audit.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if [ -f docs/ui-audit.md ]; then git add docs/ui-audit.md; fi
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
            exit 0
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"
          git commit -m "Update simulator screenshots and UI audit [skip ci]"
          # Rebase rather than force: this branch is also being pushed to by hand.
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Fail if the walk could not reach every screen
        if: steps.walk.outputs.status != '0'
        run: |
          echo "the walk exited ${{ steps.walk.outputs.status }} — see MISSING above"
          exit 1

      # Same lesson as the build job: a diagnostic printed in the middle of a three-thousand
      # line log is a diagnostic nobody reads. The walk dumps the accessibility tree wherever
      # it cannot find a control, and those dumps belong at the bottom.
      - name: What the walk could actually see
        if: failure()
        run: python3 Scripts/show-tree-dumps.py artifacts/screens

      - name: Upload simulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idb-artifacts
          path: artifacts
          retention-days: 7
