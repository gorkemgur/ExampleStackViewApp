name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Homebrew re-indexes the world before every `install` otherwise: 20-40 seconds per job,
  # three jobs, for formulae whose version this project does not care about.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  core:
    name: DupeCore unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

          # No iOS 26-only API is called any more — the one that was, `glassEffect`, made the
          # reading on the dock illegible and was removed — so there is nothing to assert
          # here beyond what the build itself will say.

      # The rule the whole layering rests on, enforced by the build rather than by
      # discipline. DupeCore holds the reasoning that decides what gets deleted, and it is
      # testable on a Linux box precisely because none of it can reach a platform framework.
      # Nothing checked that until it was a grep.
      - name: DupeCore must stay platform-free
        run: |
          set -euo pipefail
          if grep -rnE '^import (SwiftUI|UIKit|Photos|PhotosUI|Vision|AVFoundation|ActivityKit|WidgetKit|CoreGraphics|ImageIO)$'               Packages/DupeCore/Sources; then
            echo "::error::DupeCore imported a platform framework. The engine has to stay testable without a simulator."
            exit 1
          fi
          echo "clean"

      - name: Cache the package build
        uses: actions/cache@v4
        with:
          path: Packages/DupeCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/DupeCore/Sources/**/*.swift', 'Packages/DupeCore/Tests/**/*.swift', 'Packages/DupeCore/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run tests
        run: swift test --package-path Packages/DupeCore

  app:
    name: iOS build and simulator tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: simulator
        run: echo "udid=$(python3 Scripts/pick-simulator.py)" >> "$GITHUB_OUTPUT"

      # A cold build is two and a half minutes of the six this job takes, every single push,
      # to recompile files that did not change. The key moves with the sources so a hit is
      # exact; `restore-keys` falls back to the most recent build of this branch, which is
      # what makes the *incremental* case work — the common one, where two files changed.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .derived
          key: derived-${{ runner.os }}-${{ hashFiles('DupeSpace/Sources/**/*.swift', 'Shared/**/*.swift', 'DupeSpaceWidgets/**/*.swift', 'Packages/DupeCore/Sources/**/*.swift', 'project.yml') }}
          restore-keys: |
            derived-${{ runner.os }}-

      - name: Test
        run: |
          set -o pipefail
          # -enableCodeCoverage NO: instrumenting every file costs about a minute and nothing
          # in this pipeline reads the coverage. -derivedDataPath: so the cache above has
          # something to hold on to.
          xcodebuild test \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath .derived \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          retention-days: 7

      # Last, deliberately.
      #
      # This used to run inside the test step, which put it *above* the artifact upload and a
      # hundred lines of Node deprecation notices — so the tail of the log, which is the only
      # part anyone reads first, never contained the failure. The whole log is three thousand
      # lines and the reason is four of them; those four belong at the bottom.
      - name: What actually failed
        if: failure()
        run: |
          echo "::group::Compile errors"
          grep -nE "error:" xcodebuild.log | grep -v "Checking existence" | sort -u | head -40 || echo "none"
          echo "::endgroup::"
          echo "::group::Test failures"
          grep -nE "XCTAssert|' failed \(|Failing tests:" xcodebuild.log | head -40 || echo "none"
          echo "::endgroup::"
          echo "::group::Verdict"
          grep -nE "\*\* [A-Z ]+ \*\*" xcodebuild.log | tail -5 || true
          echo "::endgroup::"

  site:
    name: Landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the page
        run: python3 Scripts/check-site.py docs/index.html

  idb:
    name: Simulator automation (idb)
    runs-on: macos-15
    # No `needs: app`. It waited for the entire test job — six to ten minutes — and then built
    # the app again from scratch on its own runner, which is seven minutes of wall clock spent
    # waiting for a result it does not consume. They are separate machines; they can run at
    # the same time. The screenshot commit is [skip ci] either way.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      # brew install idb-companion pulls a large bottle and its dependencies on every run.
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-idb-v1

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: idb-derived-${{ runner.os }}-${{ hashFiles('DupeSpace/Sources/**/*.swift', 'Shared/**/*.swift', 'DupeSpaceWidgets/**/*.swift', 'Packages/DupeCore/Sources/**/*.swift', 'project.yml') }}
          restore-keys: |
            idb-derived-${{ runner.os }}-

      - name: Install XcodeGen and idb
        run: |
          set -euo pipefail
          brew install xcodegen
          # Homebrew refuses formulae from third-party taps until the tap is trusted.
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pipx install fb-idb
          # pipx drops shims in ~/.local/bin, which is not on the runner's default PATH.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/idb" --help > /dev/null

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build \
            -project DupeSpace.xcodeproj \
            -scheme DupeSpace \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator, install and inspect
        run: |
          set -euo pipefail
          UDID=$(python3 Scripts/pick-simulator.py)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP=build/Build/Products/Debug-iphonesimulator/DupeSpace.app
          test -d "$APP"

          mkdir -p artifacts

          idb install --udid "$UDID" "$APP"
          # simctl, not idb: it reliably forwards launch arguments, and the fixture
          # flag is what puts a library in front of the app on a fresh simulator.
          xcrun simctl launch "$UDID" com.gorkemgur.dupespace -ui-testing || true

          # The accessibility bridge is not ready the instant launch returns, and on a slow
          # runner "not ready" and "the screen is genuinely empty" look identical. Poll until
          # the tree both parses and carries the root screen, rather than sampling once and
          # calling a cold simulator a regression.
          FOUND=0
          for attempt in $(seq 1 20); do
            if idb ui describe-all --udid "$UDID" > artifacts/accessibility-tree.json 2>artifacts/describe-error.txt \
               && grep -q "storage" artifacts/accessibility-tree.json; then
              FOUND=1
              echo "accessibility tree ready after ${attempt} attempt(s)"
              break
            fi
            sleep 5
          done

          # simctl owns the display, so it can snapshot even when the idb bridge cannot.
          xcrun simctl io "$UDID" screenshot artifacts/launch.png || true

          if [ "$FOUND" -ne 1 ]; then
            echo "root screen never exposed its storage elements"
            tail -20 artifacts/describe-error.txt || true
            exit 1
          fi

          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Walk the app and photograph every screen
        id: walk
        # A partial walk is not a failure worth stopping the run over — the screens it did reach
        # are still worth having — but it must not pass silently either, or the page keeps
        # showing whatever era the missing ones were captured in.
        run: |
          set +e
          python3 Scripts/capture-screens.py "$UDID" artifacts/screens
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Measure layout and animation
        run: python3 Scripts/audit-ui.py "$UDID" artifacts/audit

      # The handover instrument is not a state, so a still cannot show it. Never fails the
      # run: a recording that did not come off is a missing preview, not a broken app.
      - name: Record the deletion
        continue-on-error: true
        run: python3 Scripts/record-deletion.py "$UDID" artifacts/motion/deletion.mov

      - name: Commit the screenshots
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          shopt -s nullglob
          shots=(artifacts/screens/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "no screenshots to commit"
            exit 0
          fi

          # Replaced wholesale rather than copied over: a screenshot the walk could not take
          # this time is a screenshot of an app that no longer exists, and leaving it beside
          # eight new ones is how the page came to show two designs at once.
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp "${shots[@]}" docs/screenshots/

          # The audit report travels with the pictures: an artifact nobody downloads is a
          # measurement nobody reads.
          if [ -f artifacts/audit/ui-audit.md ]; then
            cp artifacts/audit/ui-audit.md docs/ui-audit.md
          fi

          # Same argument as the screenshots, for the one screen that has to be watched rather
          # than looked at.
          if [ -f artifacts/motion/deletion.mov ]; then
            mkdir -p docs/motion
            cp artifacts/motion/deletion.mov docs/motion/deletion.mov
            # The GIF beside it is made off the runner and is stale the moment the .mov
            # changes. Removing it is better than leaving a preview of a build that no longer
            # exists — the same argument as replacing the screenshots wholesale.
            rm -f docs/motion/deletion.gif
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if [ -d docs/motion ]; then git add docs/motion; fi
          if [ -f docs/ui-audit.md ]; then git add docs/ui-audit.md; fi
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
            exit 0
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"
          git commit -m "Update simulator screenshots and UI audit [skip ci]"
          # Rebase rather than force: this branch is also being pushed to by hand.
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Fail if the walk could not reach every screen
        if: steps.walk.outputs.status != '0'
        run: |
          echo "the walk exited ${{ steps.walk.outputs.status }} — see MISSING above"
          exit 1

      # Same lesson as the build job: a diagnostic printed in the middle of a three-thousand
      # line log is a diagnostic nobody reads. The walk dumps the accessibility tree wherever
      # it cannot find a control, and those dumps belong at the bottom.
      - name: What the walk could actually see
        if: failure()
        run: python3 Scripts/show-tree-dumps.py artifacts/screens

      - name: Upload simulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idb-artifacts
          path: artifacts
          retention-days: 7
